<title id="title">Ruleway — Connected R</title><desc id="desc">An R monogram whose diagonal leg joins three connected process stages through a smooth navy-to-teal gradient extending into the first stage. The letter and workflow form one integrated vector symbol. Vector lettering, no external font dependency.</desc>
